name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Versi rilis (contoh: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug :shared:desktopTest --no-daemon

      - name: Rename APK asset
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk OSISPaperless-Android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "OSISPaperless ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            Rilis resmi **OSISPaperless** untuk perangkat Android.
            Unduh hanya melalui **Portal QR Code OSIS** (Vercel) menggunakan Kode Sesi Rapat dari Pimpinan Rapat.
          files: |
            OSISPaperless-Android.apk
